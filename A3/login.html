<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Lexi</title>
    <link rel="stylesheet" href="CSS/lexi.css">
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="CSS/temas.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">

    <main class="caixa-login-ev">
<section class="lado-form" style="position: relative;">
    <a href="lexi.html" style="display: inline-flex; align-items: center; gap: 5px; color: var(--azul-profundo); font-weight: bold; text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; align-self: flex-start;">
        ← Voltar
    </a>

    <h2 style="color: var(--preto-lexi); font-family: 'OpenDyslexic', sans-serif; font-size: 2.5rem; margin-bottom: 10px;">Lexi</h2>
    <h3 style="margin-bottom: 20px;">Acessar conta</h3>
    
    <label class="label-login">Email ou CPF</label>
    <input type="text" placeholder="Digite seu email" class="input-login" style="margin-bottom: 15px;">
    
    <label class="label-login">Senha</label>
    <div class="input-senha-container" style="position: relative; display: flex; align-items: center;">
        <input type="password" id="input-senha" placeholder="Digite sua senha" class="input-login" style="padding-right: 45px !important; width: 100%;">
        <img src="ICON/iconOlhoFechado.webp" id="toggleSenha" alt="Mostrar senha" 
            role="button" 
            tabindex="0"
            style="position: absolute; right: 15px; cursor: pointer; width: 22px; height: 22px; z-index: 15; user-select: none; opacity: 0.7;">
    </div>           

    <a href="#" style="display: block; text-align: right; color: var(--azul-profundo); font-size: 0.85rem; font-weight: bold; text-decoration: underline; margin-top: -15px; margin-bottom: 25px;">Esqueceu a senha?</a>
    <button type="button" class="btn-entrar" onclick="localStorage.setItem('fazerLogin', 'sim'); localStorage.setItem('usuarioNome', 'Sandy'); window.location.href='lexi.html';">Acessar Lexi</button>
</section>

<div class="divisor-meio">
    <div class="linha-vertical"></div>
    <span class="bolinha-ou">OU</span>
</div>

<section class="lado-social">
    <h3 style="margin-bottom: 20px;">Entrar com Redes Sociais</h3>
    
    <button class="btn-social btn-google" style="margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px;"> 
        <img src="ICON/iconGoogle.png" alt="" style="width: 20px; height: 20px;"> Entrar com Google
    </button>
    <button class="btn-social btn-apple" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
        <img src="ICON/iconApple.png" alt="" style="width: 20px; height: 20px;"> Entrar com Apple
    </button>
</section>

    </main>
    <script src="SCRIPT/login.js"></script>
</body>
</html>
